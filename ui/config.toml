[project]
user_env = []
session_timeout = 3600
user_session_timeout = 1296000  # 15 days
cache = false
persist_user_env = false
mask_user_env = false
allow_origins = ["*"]

[features]
unsafe_allow_html = false
latex = false
user_message_autoscroll = true
assistant_message_autoscroll = true
auto_tag_thread = true
edit_message = true
allow_thread_sharing = false

[features.spontaneous_file_upload]
    enabled = true
    accept = ["*/*"]
    max_files = 20
    max_size_mb = 500

[features.audio]
    enabled = false
    sample_rate = 24000

[features.mcp]
    enabled = false

[features.mcp.sse]
    enabled = true

[features.mcp.streamable-http]
    enabled = true

[features.mcp.stdio]
    enabled = true
    allowed_executables = [ "npx", "uvx" ]

[UI]
name = "DBAgent"
language = "en-US"
cot = "full"

# With this config located in ui/config.toml, Chainlit will serve static assets
# from ui/public/.
custom_css = "/public/custom.css"
custom_js = "/public/custom.js"

alert_style = "classic"
logo_file_url = ""
default_avatar_file_url = ""

[meta]
generated_by = "2.9.4"
